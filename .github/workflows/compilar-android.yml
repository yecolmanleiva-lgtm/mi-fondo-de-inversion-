name: Compilar Android local

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Comprobar y empaquetar la interfaz sin internet
        working-directory: android/web
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build
          mkdir -p ../app/src/main/assets/www
          cp -R dist/. ../app/src/main/assets/www/
      - name: Compilar APK y probar el calendario
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Habilitar emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Probar app cerrada y sin permiso de internet
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Preparar herramienta de firma local
        run: cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" android/app/build/apksigner.jar
      - name: Guardar APK y resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Mi-Fondo-Android
          if-no-files-found: error
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/reports/tests/
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/apksigner.jar
