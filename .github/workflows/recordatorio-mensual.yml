name: Recordatorio mensual

on:
  schedule:
    - cron: '0 11 7 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  enviar-recordatorio:
    runs-on: ubuntu-latest

    steps:
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install firebase-admin

      - name: Enviar notificación al Xiaomi
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FCM_TOKEN: ${{ secrets.FCM_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import firebase_admin
          from firebase_admin import credentials, messaging

          cuenta = json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT"])
          firebase_admin.initialize_app(
              credentials.Certificate(cuenta)
          )

          mensaje = messaging.Message(
              token=os.environ["FCM_TOKEN"],
              notification=messaging.Notification(
                  title="🔔 Recordatorio de aporte mensual",
                  body="Hoy es día de realizar tu aporte al fondo de inversión. ¡Cada aporte te acerca a tu meta!"
              ),
              webpush=messaging.WebpushConfig(
                  fcm_options=messaging.WebpushFCMOptions(
                      link="https://yecolmanleiva-lgtm.github.io/mi-fondo-de-inversion-/"
                  )
              )
          )

          messaging.send(mensaje)
          print("Notificación enviada a Firebase correctamente")
          PY
