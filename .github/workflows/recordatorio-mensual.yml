name: Prueba anterior de notificaciones (manual)

on:
  workflow_dispatch:
    inputs:
      modo:
        description: Validar sin entregar, o enviar una prueba al Xiaomi
        type: choice
        options: [validar, enviar-prueba]
        default: validar

permissions:
  contents: write # Registro mensual de envío; nunca contiene datos financieros ni secretos.
concurrency:
  group: recordatorio-mensual
  cancel-in-progress: false

jobs:
  enviar-recordatorio:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Instalar dependencia fijada
        run: python -m pip install firebase-admin==7.7.0
      - name: Validar o enviar recordatorio
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FCM_TOKEN: ${{ secrets.FCM_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          MODO: ${{ inputs.modo || 'mensual' }}
        run: python scripts/enviar_recordatorio.py
