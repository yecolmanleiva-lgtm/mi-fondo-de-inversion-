<!doctype html>
<html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Comprobar notificaciones</title>
<style>body{font:18px system-ui;max-width:36rem;margin:32px auto;padding:20px;color:#063f38}button{font:inherit;padding:16px;background:#063f38;color:white;border:0;border-radius:12px}pre{white-space:pre-wrap;font:inherit}</style>
<h1>Comprobar este teléfono</h1>
<p>Esta comprobación no borra ni modifica tus aportes.</p>
<button id="comprobar">Mostrar código de comprobación</button><pre id="resultado" role="status"></pre>
<p><button id="prueba-local">Probar aviso en este teléfono</button></p><pre id="resultado-local" role="status"></pre>
<hr><h2>Renovar el identificador</h2><p>Usar cuando Firebase indique «no registrado». Después hay que actualizar el secreto FCM_TOKEN de GitHub.</p>
<button id="renovar">Renovar identificador</button> <button id="copiar-nuevo" disabled>Copiar identificador nuevo</button>
<pre id="resultado-renovar" role="status"></pre>
<script src="./notificaciones.js"></script>
<script>
document.getElementById('comprobar').onclick=async()=>{
 const result=document.getElementById('resultado'); result.textContent='Comprobando…';
 try {
  if(!('Notification' in window)||Notification.permission!=='granted') {result.textContent='Las notificaciones no tienen permiso en este navegador.';return;}
  const registration=await navigator.serviceWorker.getRegistration(new URL('./',location.href));
  if(!registration?.active) {result.textContent='No hay un receptor activo. Abrí primero la aplicación.';return;}
  const {messaging,getToken}=await prepararMensajeria();
  const token=await getToken(messaging,{vapidKey,serviceWorkerRegistration:registration});
  if(!token) throw new Error('sin-token');
  const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(token.trim()));
  const code=Array.from(new Uint8Array(hash),x=>x.toString(16).padStart(2,'0')).join('').slice(0,12);
  result.textContent='Código: '+code+'\nPermiso: concedido\nReceptor: '+registration.active.state+'\nRuta: '+new URL(registration.active.scriptURL).pathname+(registration.waiting?'\nHay una actualización pendiente.':'');
 } catch {result.textContent='No se pudo comprobar. Revisá que haya Internet e intentá otra vez.';}
};
document.getElementById('prueba-local').onclick=async()=>{
 const button=document.getElementById('prueba-local');
 const result=document.getElementById('resultado-local');
 button.disabled=true; result.textContent='Probando el receptor del teléfono…';
 try {
  if(!('Notification' in window)||Notification.permission!=='granted') {
   result.textContent='Falta permiso de notificaciones en este navegador.'; return;
  }
  const registration=await navigator.serviceWorker.getRegistration(new URL('./',location.href));
  if(!registration?.active) {result.textContent='No hay receptor activo.';return;}
  const id='diagnostico-'+crypto.randomUUID();
  registration.active.postMessage({type:'PUSH',data:{id,title:'Prueba local de Mi Fondo',body:'Este aviso comprueba el receptor del teléfono; no pasó por Firebase.',url:new URL('./',location.href).href}});
  await new Promise(resolve=>setTimeout(resolve,2000));
  const notifications=await registration.getNotifications({tag:id});
  result.textContent=notifications.length
   ? 'El navegador creó el aviso. Revisá la barra de notificaciones y decime si ves «Prueba local de Mi Fondo».'
   : 'El receptor no registró el aviso en 2 segundos. Decime si llegó a aparecer.';
  if(registration.waiting) result.textContent+=' Hay una actualización del receptor pendiente.';
 } catch { result.textContent='La prueba local falló. Avisame este resultado.'; }
 finally {button.disabled=false;}
};
let tokenRenovado='';
document.getElementById('renovar').onclick=async()=>{
 if(!confirm('Esto renueva solo las notificaciones. Después debés copiar el identificador nuevo a FCM_TOKEN en GitHub. ¿Continuar?'))return;
 const button=document.getElementById('renovar'), result=document.getElementById('resultado-renovar');
 button.disabled=true; document.getElementById('copiar-nuevo').disabled=true;tokenRenovado='';
 result.textContent='Renovando…';
 try {
  if(Notification.permission!=='granted')throw new Error('permiso');
  const registration=await navigator.serviceWorker.getRegistration(new URL('./',location.href));
  if(!registration?.active)throw new Error('receptor');
  const {messaging,getToken}=await prepararMensajeria();
  const {deleteToken}=await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js');
  await deleteToken(messaging);
  tokenRenovado=await getToken(messaging,{vapidKey,serviceWorkerRegistration:registration});
  if(!tokenRenovado)throw new Error('token');
  document.getElementById('copiar-nuevo').disabled=false;
  result.textContent='Renovado. Tocá «Copiar identificador nuevo» y pegalo únicamente en el secreto FCM_TOKEN de GitHub.';
 }catch{result.textContent='No se pudo completar la renovación. Comprobá Internet y el permiso de notificaciones.';}
 finally{button.disabled=false;}
};
document.getElementById('copiar-nuevo').onclick=async()=>{
 try{await navigator.clipboard.writeText(tokenRenovado);document.getElementById('resultado-renovar').textContent='Copiado. Actualizá FCM_TOKEN en GitHub. No lo pegues en el chat.';}
 catch{document.getElementById('resultado-renovar').textContent='No se pudo copiar. Volvé a tocar «Copiar identificador nuevo».';}
};
</script></html>
